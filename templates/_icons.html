{% macro icon(name, size=20) -%}
<svg class="icon" width="{{ size }}" height="{{ size }}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
{%- if name == 'dashboard' %}
<rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/>
{%- elif name == 'building' %}
<path d="M4 21V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v16"/><path d="M16 9h2a2 2 0 0 1 2 2v10"/><path d="M3 21h18"/><path d="M8 7h4M8 11h4M8 15h4"/>
{%- elif name == 'users' %}
<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6"/><circle cx="17" cy="9" r="2.5"/><path d="M17.5 14c2.6.3 4 2.1 4 4.5"/>
{%- elif name == 'coffee' %}
<path d="M4 9h12v6a5 5 0 0 1-5 5H9a5 5 0 0 1-5-5V9z"/><path d="M16 11h2a2.5 2.5 0 0 1 0 5h-2"/><path d="M8 3v3M12 3v3"/>
{%- elif name == 'truck' %}
<path d="M2 6h11v10H2z"/><path d="M13 9h4l4 4v3h-8"/><circle cx="7" cy="18" r="2"/><circle cx="17" cy="18" r="2"/>
{%- elif name == 'box' %}
<path d="M21 8l-9-5-9 5v8l9 5 9-5V8z"/><path d="M3 8l9 5 9-5"/><path d="M12 13v8"/>
{%- elif name == 'receipt' %}
<path d="M6 3h12v18l-3-2-3 2-3-2-3 2V3z"/><path d="M9 8h6M9 12h6"/>
{%- elif name == 'list' %}
<path d="M9 6h12M9 12h12M9 18h12"/><circle cx="4.5" cy="6" r="1"/><circle cx="4.5" cy="12" r="1"/><circle cx="4.5" cy="18" r="1"/>
{%- elif name == 'badge' %}
<rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="11" r="2.2"/><path d="M5.5 16c.6-1.8 2-2.5 3.5-2.5s2.9.7 3.5 2.5"/><path d="M15 10h3M15 14h3"/>
{%- elif name == 'card' %}
<rect x="2.5" y="5" width="19" height="14" rx="2"/><path d="M2.5 10h19M6 15h4"/>
{%- elif name == 'chart' %}
<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>
{%- elif name == 'money' %}
<circle cx="12" cy="12" r="9"/><path d="M14.5 9.2c-.5-.8-1.4-1.2-2.5-1.2-1.5 0-2.5.8-2.5 2s1 1.7 2.5 2 2.5.8 2.5 2-1 2-2.5 2c-1.1 0-2-.4-2.5-1.2M12 6.5V8M12 16v1.5"/>
{%- elif name == 'clock' %}
<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>
{%- elif name == 'search' %}
<circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/>
{%- elif name == 'plus' %}
<path d="M12 5v14M5 12h14"/>
{%- elif name == 'edit' %}
<path d="M4 20h4l11-11-4-4L4 16v4z"/><path d="M13.5 6.5l4 4"/>
{%- elif name == 'trash' %}
<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 11v6M14 11v6"/>
{%- elif name == 'alert' %}
<path d="M12 3l10 18H2L12 3z"/><path d="M12 10v4M12 17.5v.5"/>
{%- elif name == 'check' %}
<circle cx="12" cy="12" r="9"/><path d="M8 12.5l3 3 5-6"/>
{%- elif name == 'x' %}
<path d="M6 6l12 12M18 6L6 18"/>
{%- elif name == 'eye' %}
<path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>
{%- elif name == 'menu' %}
<path d="M4 6h16M4 12h16M4 18h16"/>
{%- elif name == 'chevron-left' %}
<path d="M15 6l-6 6 6 6"/>
{%- elif name == 'chevron-right' %}
<path d="M9 6l6 6-6 6"/>
{%- elif name == 'arrow-left' %}
<path d="M19 12H5M11 6l-6 6 6 6"/>
{%- elif name == 'inbox' %}
<path d="M3 13l3-8h12l3 8v6H3v-6z"/><path d="M3 13h5l1 3h6l1-3h5"/>
{%- elif name == 'logout' %}
<path d="M9 4H5a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h4"/><path d="M16 8l4 4-4 4M20 12H9"/>
{%- endif %}
</svg>
{%- endmacro %}
